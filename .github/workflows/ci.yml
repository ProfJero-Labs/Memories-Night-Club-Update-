# Runs on every push and pull request. Keep main deployable: a red check means don't merge.
# On main, once every check is green, the deploy jobs at the bottom ship what changed
# (waiting for approval on the "production" environment first).
name: CI

on:
  push:
  pull_request:
  # Actions tab → CI → Run workflow (on main) redeploys the Worker and the rules regardless of changes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Worker tests + browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        run: npm ci --prefix worker
      - name: Known vulnerabilities in the Worker's dependencies (fails on high or critical)
        run: npm audit --prefix worker --omit=dev --audit-level=high
      - name: Worker tests (payments, roles, door, lookup, CSP, secrets…)
        run: npm test
      - name: Worker bundles for Cloudflare
        run: npm run worker:check
      - name: Install Chromium for the browser journeys
        run: npx --prefix worker playwright install --with-deps chromium
      - name: Browser journeys
        run: |
          export PLAYWRIGHT_CHROMIUM_PATH="$(node -e "import('./worker/node_modules/playwright/index.mjs').then(p => console.log(p.chromium.executablePath()))")"
          npm run test:e2e

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the commits in this push / PR (not the whole history, which has a known, revoked-
      # pending Brevo key: see docs/OPEN_DECISIONS.md).
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  rules:
    name: Firestore + Storage rules (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/test/package-lock.json
      - run: npm ci --prefix firebase/test
      - run: npm run test:rules

  # ---- Deploy (main only) ----
  # The site itself (public/) is not here: the Cloudflare Pages project is connected to this repo
  # and deploys on its own. Worker secrets (Paystack, Brevo, …) live in Cloudflare and are untouched.

  changes:
    name: What changed
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      firebase: ${{ steps.filter.outputs.firebase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
            firebase:
              - 'firebase.json'
              - 'firebase/firestore.rules'
              - 'firebase/storage.rules'

  deploy-worker:
    name: Deploy Worker (Cloudflare)
    needs: [test, secrets, rules, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - name: wrangler deploy
        run: npm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-firebase:
    name: Deploy Firestore + Storage rules
    needs: [test, secrets, rules, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-firebase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: firebase deploy
        run: npx --yes firebase-tools@15 deploy --only firestore:rules,storage --project memoriesnightclub-2717f --non-interactive
