<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nights · Memories</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><div class="toast"></div><script src="config.js"></script><script type="module">import {shell,footer,getEvents,eventDate,eventTime,art,esc} from './app.js';const root=document.querySelector('#app');root.innerHTML=shell()+`<main><section class="section" style="padding-top:70px"><div class="wrap"><div class="section-head"><h1 class="display" style="font-size:clamp(64px,14vw,110px);line-height:.8;margin:0">NIGHTS</h1><p>Choose your night. Then decide how you're showing up.</p></div><div class="poster-grid" id="list"></div></div></section></main>`+footer();try{const d=await getEvents();const list=document.querySelector('#list');list.innerHTML=(d.events||[]).map(e=>`<a class="poster" href="event.html?id=${encodeURIComponent(e.id)}"><div class="poster-art">${art(e.artwork,e.name)}</div><div class="poster-body"><div class="poster-date">${eventDate(e)}</div><h3>${esc(e.name)}</h3><div class="poster-meta">${esc(eventTime(e))} · ${esc(e.venue||'Cape Coast')}</div></div><div class="arrow">↗</div></a>`).join('')||'<div class="empty" style="grid-column:1/-1">No public nights are currently published.</div>'}catch(e){document.querySelector('#list').innerHTML='<div class="empty" style="grid-column:1/-1">Unable to load nights.</div>'}</script></body></html>
