<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Ticket · Memories</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="verify">
  <div class="verify-card">
    <div class="eyebrow">DOOR CHECK</div>
    <h1 class="display" style="font-size:80px;line-height:.8">TICKET<br>VERIFICATION</h1>

    <div id="authBadge" style="margin-top:20px;display:none;">
      <span class="eyebrow" style="color:var(--muted);">Signed in as <strong id="authEmail" style="color:var(--paper)"></strong></span>
    </div>

    <div id="signInPrompt" style="margin-top:20px;padding:14px;border:1px dashed var(--line);background:var(--panel)">
      <p style="color:var(--muted);font-size:13px;margin:0 0 10px">Sign in to mark tickets as used.</p>
      <a class="btn red small" href="login.html" style="display:inline-block">STAFF SIGN IN</a>
    </div>

    <input id="token" style="width:100%;padding:14px;background:var(--panel2);border:1px solid var(--line);color:var(--paper);margin:20px 0" placeholder="Scan token / paste secure token">
    <div style="display:flex;gap:10px">
      <button class="btn red" style="flex:1" id="check">LOOK UP</button>
      <button class="btn red" style="flex:1;display:none" id="markUsed">MARK AS USED</button>
    </div>
    <div id="result" style="margin-top:20px"></div>
  </div>
</main>

<script src="config.js"></script>
<script type="module">
import {api,params,esc} from './app.js';
import {auth,onAuthStateChanged} from './firebase.js';

// Expose ID token to app.js so authenticated requests include it
window.getFirebaseIdToken = async () => auth.currentUser?.getIdToken() || null;

let currentUser = null;
let lastCheckedToken = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  const authBadge = document.querySelector('#authBadge');
  const signInPrompt = document.querySelector('#signInPrompt');
  if (user) {
    document.querySelector('#authEmail').textContent = user.email || user.uid;
    authBadge.style.display = 'block';
    signInPrompt.style.display = 'none';
  } else {
    authBadge.style.display = 'none';
    signInPrompt.style.display = 'block';
  }
});

const input = document.querySelector('#token');
input.value = params.get('token') || '';

document.querySelector('#check').onclick = async () => {
  const token = input.value.trim();
  if (!token) return;
  lastCheckedToken = token;
  const r = document.querySelector('#result');
  r.innerHTML = '<div class="status">Looking up ticket…</div>';
  document.querySelector('#markUsed').style.display = 'none';

  try {
    const d = await api('/api/verify/' + encodeURIComponent(token));
    const validClass = d.valid ? 'success' : 'error';
    r.innerHTML = `
      <div class="status ${validClass}">
        <strong class="display" style="font-size:42px">${d.valid ? 'VALID TICKET' : d.message || 'NOT VALID'}</strong>
        ${d.ticket ? `<p style="margin-top:10px">
          <strong>${esc(d.ticket.eventName || '')}</strong><br>
          ${esc(d.ticket.customerName || '')}<br>
          <small style="color:var(--muted)">${esc(d.ticket.displayCode || '')}</small>
        </p>` : ''}
      </div>
    `;

    // Show "MARK AS USED" only when ticket is valid AND staff is signed in
    if (d.valid && currentUser) {
      document.querySelector('#markUsed').style.display = 'block';
    }
  } catch (e) {
    r.innerHTML = `<div class="status error">${esc(e.message)}</div>`;
  }
};

document.querySelector('#markUsed').onclick = async () => {
  if (!lastCheckedToken) return;
  if (!currentUser) {
    document.querySelector('#result').innerHTML = '<div class="status error">Sign in required.</div>';
    return;
  }
  const btn = document.querySelector('#markUsed');
  btn.disabled = true;
  btn.textContent = 'CHECKING IN…';

  try {
    const r = await api('/api/checkin', {
      method: 'POST',
      body: JSON.stringify({ token: lastCheckedToken })
    });

    const result = document.querySelector('#result');
    if (r.valid) {
      result.innerHTML = `
        <div class="status success">
          <strong class="display" style="font-size:52px">ENTRY<br>CONFIRMED</strong>
          <p style="margin-top:15px">${esc(r.ticket?.customerName || 'Guest')}</p>
        </div>
      `;
    } else {
      result.innerHTML = `<div class="status error"><strong class="display" style="font-size:36px">${esc(r.message)}</strong></div>`;
    }
    btn.style.display = 'none';

    // Auto-focus and clear for next scan
    input.value = '';
    input.focus();
  } catch (e) {
    document.querySelector('#result').innerHTML = `<div class="status error">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'MARK AS USED';
  }
};

// Allow Enter key to trigger lookup
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.querySelector('#check').click(); });
</script>
</body></html>
