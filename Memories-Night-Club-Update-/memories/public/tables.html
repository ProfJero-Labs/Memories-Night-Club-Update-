<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tables · Memories</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><div class="toast"></div><script src="config.js"></script><script type="module">import {shell,footer,getEvents,getEvent,params,esc,money} from './app.js';document.querySelector('#app').innerHTML=shell()+`<main><section class="section" style="padding-top:65px"><div class="wrap"><div class="eyebrow">PLAN THE NIGHT</div><h1 class="display" style="font-size:clamp(64px,14vw,110px);line-height:.8">TABLES</h1><p style="color:var(--muted);max-width:550px">Choose a night, choose your table, then make it yours.</p><div style="margin:35px 0"><label class="eyebrow">Choose a night</label><select id="event" style="margin-top:10px;width:100%;max-width:500px;padding:14px;background:var(--panel);border:1px solid var(--line);color:var(--paper)"></select></div><div id="packages" class="table-grid"></div></div></section></main>`+footer();let events=[];try{events=(await getEvents()).events||[];const sel=document.querySelector('#event');sel.innerHTML=events.map(e=>`<option value="${e.id}">${esc(e.name)} · ${new Date(e.date).toLocaleDateString('en-GH',{day:'2-digit',month:'short'})}</option>`).join('');const wanted=params.get('event');if(wanted)sel.value=wanted;async function load(){const d=await getEvent(sel.value);document.querySelector('#packages').innerHTML=(d.tablePackages||[]).map(p=>{const remaining=typeof p.remaining==='number'?p.remaining:null;const low=remaining!==null&&remaining>0&&remaining<=3;return `<div class="table-card"><div class="eyebrow">TABLE${low?` · <span style="color:var(--red2)">${remaining} left</span>`:''}</div><h3>${esc(p.name)}</h3><div class="price">${money(p.pricePesewas)}</div><p style="color:var(--muted);font-size:13px">${esc(p.description||'A table for the night.')}</p><button class="btn red" style="width:100%;margin-top:12px" onclick="location.href='table-checkout.html?event=${encodeURIComponent(sel.value)}&package=${encodeURIComponent(p.id)}'">PLAN THIS TABLE</button></div>`}).join('')||'<div class="empty" style="grid-column:1/-1">Table packages for this night have not been published.</div>'}sel.onchange=load;await load()}catch(e){document.querySelector('#packages').innerHTML='<div class="empty">Unable to load table options.</div>'}</script></body></html>
