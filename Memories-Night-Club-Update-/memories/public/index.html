<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memories Night Club</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><div class="toast"></div><script>window.MEMORIES_CONFIG=window.MEMORIES_CONFIG||{};</script><script src="config.js"></script><script type="module">
import {shell,footer,getEvents,eventDate,eventTime,art,esc} from './app.js';
const root=document.querySelector('#app');root.innerHTML=shell('home')+`<main><section class="wrap hero"><div class="hero-art" id="heroArt"></div><div class="hero-copy reveal"><div class="eyebrow" id="heroEyebrow">YOUR NEXT NIGHT</div><h1 class="display" id="heroTitle">MEMORIES</h1><div class="hero-meta"><span id="heroDate">Loading</span><span id="heroTime"></span><span>CAPE COAST</span></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a id="heroTickets" class="btn red" href="nights.html">GET TICKETS</a><a class="btn ghost" href="tables.html">BOOK A TABLE</a></div></div></section><section class="section"><div class="wrap"><div class="section-head"><h2 class="display">NIGHTS</h2><p>Upcoming nights, event artwork and everything you need to decide whether you're coming.</p></div><div class="poster-grid" id="events"></div></div></section><section class="section"><div class="wrap"><div class="strip"><div class="strip-copy"><div class="eyebrow" style="color:#ffd2d8">YOUR NIGHT</div><h2 class="display">COME CORRECT.</h2><a class="btn" href="tables.html" style="align-self:flex-start">PLAN A TABLE</a></div><div class="strip-art" id="stripArt"></div></div></div></section></main>`+footer();
try{const data=await getEvents();const events=data.events||[];const e=events.find(x=>x.featured)||events[0];if(e){document.querySelector('#heroArt').innerHTML=art(e.artwork,e.name);document.querySelector('#heroTitle').textContent=e.name||'MEMORIES';document.querySelector('#heroDate').textContent=eventDate(e);document.querySelector('#heroTime').textContent=eventTime(e);document.querySelector('#heroTickets').href=`event.html?id=${encodeURIComponent(e.id)}`;document.querySelector('#stripArt').innerHTML=art(e.artwork,e.name)}const list=document.querySelector('#events');list.innerHTML=events.slice(0,8).map(e=>`<a class="poster reveal" href="event.html?id=${encodeURIComponent(e.id)}"><div class="poster-art">${art(e.artwork,e.name)}</div><div class="poster-body"><div class="poster-date">${eventDate(e)}</div><h3>${esc(e.name||'Night')}</h3><div class="poster-meta">${esc(eventTime(e))} · ${esc(e.venue||'Cape Coast')}</div></div><div class="arrow">↗</div></a>`).join('')||'<div class="empty" style="grid-column:1/-1">No public nights are currently published.</div>'}catch(err){document.querySelector('#events').innerHTML=`<div class="empty" style="grid-column:1/-1">We couldn't load the next nights. Please try again shortly.</div>`}</script></body></html>
