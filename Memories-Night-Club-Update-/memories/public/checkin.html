<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in · Memories</title><link rel="stylesheet" href="styles.css"></head><body><main class="verify"><div class="verify-card"><div class="eyebrow">MEMORIES · DOOR</div><h1 class="display" style="font-size:78px;line-height:.82">CHECK<br>IN</h1><p style="color:var(--muted)">Paste or scan the secure ticket token.</p><input id="token" style="width:100%;padding:14px;background:var(--panel2);border:1px solid var(--line);color:var(--paper);margin:20px 0;box-sizing:border-box" autofocus placeholder="Secure ticket token"><div style="display:flex;gap:10px"><button class="btn red" id="check">CHECK IN</button><a class="btn ghost" href="admin.html">CONTROL ROOM</a></div><div id="result" style="margin-top:20px"></div></div></main><script src="config.js"></script><script type="module">import {auth,onAuthStateChanged} from './firebase.js';import {api,esc} from './app.js';window.getFirebaseIdToken=async()=>auth.currentUser?.getIdToken()||null;onAuthStateChanged(auth,u=>{if(!u)location.href='login.html'});const i=document.querySelector('#token'),r=document.querySelector('#result');async function run(){if(!i.value.trim())return;r.innerHTML='<div class="status">Checking…</div>';try{const d=await api('/api/admin/checkin',{method:'POST',body:JSON.stringify({token:i.value.trim()})});r.innerHTML=`<div class="status ${d.valid?'success':'error'}"><strong class="display" style="font-size:40px">${esc(d.message)}</strong>${d.ticket?`<p>${esc(d.ticket.eventName||'')} · ${esc(d.ticket.customerName||'')}</p>`:''}</div>`;if(d.valid)i.value=''}catch(e){r.innerHTML=`<div class="status error">${esc(e.message)}</div>`}}document.querySelector('#check').onclick=run;i.addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script></body></html>
