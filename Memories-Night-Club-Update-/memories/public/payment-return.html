<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your night is being locked in · Memories</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><script src="config.js"></script><script type="module">
import {api,params,money,esc} from './app.js';
const ref=params.get('reference')||params.get('trxref');
document.querySelector('#app').innerHTML=`<main class="verify"><div class="verify-card"><div class="eyebrow">MEMORIES</div><h1 id="headline" class="display" style="font-size:82px;line-height:.8;margin:12px 0">YOUR NIGHT<br>IS BEING<br>LOCKED IN.</h1><div id="status" class="status">Confirming your payment…</div><div id="tickets" style="margin-top:20px"></div></div></main>`;

async function run(){
  if(!ref){document.querySelector('#status').className='status error';document.querySelector('#status').textContent='No payment reference was found.';return}
  for(let i=0;i<12;i++){
    try{await api('/api/checkout/verify',{method:'POST',body:JSON.stringify({reference:ref})})}catch(e){}
    const s=await api('/api/checkout/status?reference='+encodeURIComponent(ref));

    if(s.status==='issued'){
      document.querySelector('#status').className='status success';
      if(s.kind==='table'){
        document.querySelector('#status').innerHTML='<strong>PAYMENT CONFIRMED.</strong><br>Your table is reserved.';
        document.querySelector('#tickets').innerHTML=`<div class="ticket-card"><div class="ticket-icon">✓</div><div class="ticket-info"><div class="name">TABLE CONFIRMED</div><div class="id">${esc(s.packageName||'Table')} · ${esc(s.eventName||'')}</div></div></div>`;
      }else if(s.kind==='installment_topup'){
        if(s.planComplete){
          document.querySelector('#status').innerHTML='<strong>PLAN COMPLETE.</strong><br>Your ticket is ready.';
          document.querySelector('#tickets').innerHTML=(s.tickets||[]).map(t=>`<a class="ticket-card" href="ticket.html?token=${encodeURIComponent(t.token)}"><div class="ticket-icon">↗</div><div class="ticket-info"><div class="name">OPEN YOUR TICKET</div><div class="id">${esc(t.ticketId)}</div></div></a>`).join('');
        }else{
          const remaining=Math.max(0,(s.totalPesewas||0)-(s.paidPesewas||0));
          document.querySelector('#status').innerHTML=`<strong>PAYMENT RECEIVED.</strong><br>${money(s.paidPesewas||0)} paid of ${money(s.totalPesewas||0)}.`;
          document.querySelector('#tickets').innerHTML=`<div class="ticket-card"><div class="ticket-icon">◐</div><div class="ticket-info"><div class="name">PLAN IN PROGRESS · ${esc(s.planId||'')}</div><div class="id">${money(remaining)} left · ${esc(s.eventName||'')}</div></div></div><p style="color:var(--muted);font-size:12px;margin-top:10px">Save your order code <strong>${esc(s.planId||'')}</strong> — you'll need it (or your phone number) to finish paying.</p><a class="btn ghost" style="display:block;margin-top:14px;text-align:center" href="installment.html">MANAGE MY PLAN</a>`;
        }
      }else{
        document.querySelector('#status').innerHTML='<strong>PAYMENT CONFIRMED.</strong><br>Your ticket is ready.';
        document.querySelector('#tickets').innerHTML=(s.tickets||[]).map(t=>`<a class="ticket-card" href="ticket.html?token=${encodeURIComponent(t.token)}"><div class="ticket-icon">↗</div><div class="ticket-info"><div class="name">OPEN YOUR TICKET</div><div class="id">${esc(t.ticketId)}</div></div></a>`).join('');
      }
      return;
    }

    if(s.status==='failed'){
      document.querySelector('#headline').innerHTML='PAYMENT<br>DIDN\'T GO<br>THROUGH.';
      document.querySelector('#status').className='status error';
      document.querySelector('#status').textContent=s.error||'Your night is still here — try again.';
      return;
    }

    await new Promise(r=>setTimeout(r,1800));
  }
  document.querySelector('#headline').innerHTML='STILL<br>CONFIRMING.';
  document.querySelector('#status').textContent='Please do not pay again. Check back shortly.';
}
run();
</script></body></html>
