<style>
  .ticket-page { display: grid; gap: 34px; padding: 28px 0 10px; }
  @media (min-width: 960px) { .ticket-page { grid-template-columns: 420px 1fr; gap: 64px; align-items: start; padding-top: 48px; } }
  .post { display: grid; gap: 16px; }
  .ticket-page .ticket { transform: rotate(-.6deg); }
  .post img { width: 100%; max-width: 440px; aspect-ratio: 1; border: 1px solid var(--line-2); background: var(--ink-3); }
</style>
