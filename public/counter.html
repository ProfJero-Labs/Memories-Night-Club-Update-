<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bar order · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  .bar-wrap { max-width: 560px; margin: 0 auto; padding: 14px var(--gutter) calc(110px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
  .bar-head { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .bar-head h1 { font: 400 26px/1 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .02em; }
  .drink { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dotted var(--line-2); }
  .drink .grow { flex: 1; min-width: 0; font-weight: 600; } .drink .grow small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; margin-top: 2px; }
  .drink.out .grow { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .stepper { display: flex; align-items: center; border: 1.5px solid var(--line-2); }
  .stepper button { width: 44px; height: 44px; background: none; border: 0; color: var(--paper); font-size: 22px; }
  .stepper span { min-width: 28px; text-align: center; font-weight: 700; }
  .pickup { font: 400 clamp(72px, 26vw, 120px)/1 var(--display); letter-spacing: .08em; text-align: center; background: var(--paper); color: var(--ink); padding: 18px 10px; }
  .cat { font: 400 22px var(--display); text-transform: uppercase; color: var(--mustard); margin: 10px 0 0; }
</style>
<script src="/config.js"></script>
</head>
<body>
<main class="bar-wrap">
  <header class="bar-head"><img src="/assets/logo-sm.webp" alt="Memories" width="93" height="22"><h1 id="label">Bar order</h1></header>
  <div id="app"><div class="loading" role="status">PULLING UP THE MENU…</div></div>
</main>
<aside class="buybar" id="dock" aria-label="Pay for your order"><div class="sum" id="dockSum"></div><button class="btn red" id="dockBtn" type="button" hidden>Pay</button></aside>
<script type="module" src="/pages/counter.js"></script>
</body>
</html>
