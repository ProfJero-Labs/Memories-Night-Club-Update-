<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visit · Memories</title>
<meta name="description" content="Find Memories at SamRit Hotel, Cape Coast. Friday + Saturday. Doors 10PM.">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<main class="wrap">
  <header class="page-head"><h1 class="display">Visit</h1></header>
  <div id="root"></div>
</main>
<script type="module">
import { chrome, esc, $, waLink, igLink, mapLink } from './app.js';
const s = await chrome('visit');
const digits = x => String(x || '').replace(/\D/g, '');
const rows = [
  s.phone && `<a href="tel:${digits(s.phone)}"><span class="k">Call</span><span>${esc(s.phone)}</span></a>`,
  s.whatsapp && `<a href="${waLink(s.whatsapp)}" target="_blank" rel="noopener"><span class="k">WhatsApp</span><span>Message us ↗</span></a>`,
  s.instagram && `<a href="${esc(igLink(s.instagram))}" target="_blank" rel="noopener"><span class="k">Instagram</span><span>${esc(s.instagram)} ↗</span></a>`,
  s.email && `<a href="mailto:${esc(s.email)}"><span class="k">Email</span><span>${esc(s.email)}</span></a>`,
].filter(Boolean).join('');
$('#root').innerHTML = `<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(30px,6vw,60px)">
  <section style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px">
    <h2 class="display lg">${esc(s.venue || 'SamRit Hotel, Cape Coast')}</h2>
    ${s.address ? `<p class="muted" style="margin:0;font-size:18px">${esc(s.address)}</p>` : ''}
    <div class="strip" style="max-width:640px"><span>${esc(s.nightsLine || 'Friday + Saturday')}</span><span>${esc(s.doorsLine || 'Doors 10PM')}</span><span>18+ · ID</span></div>
    <div class="row-actions" style="max-width:640px;margin-top:8px"><a class="btn red" href="${esc(mapLink(s))}" target="_blank" rel="noopener">Directions <span class="arrow">↗</span></a>${s.whatsapp ? `<a class="btn" href="${waLink(s.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</div>
  </section>
  ${rows ? `<section class="info-rows" style="max-width:640px">${rows}</section>` : ''}
  <section class="info-rows" style="max-width:640px">
    <a href="nights.html"><span class="k">What’s on</span><span>Nights →</span></a>
    <a href="tables.html"><span class="k">Big group</span><span>Book a table →</span></a>
    <a href="private.html"><span class="k">Your own night</span><span>Private night →</span></a>
  </section></div>`;
</script>
</body>
</html>
