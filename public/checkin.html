<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Door · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<style>
  .door { max-width: 560px; margin: 0 auto; padding: 16px var(--gutter) 40px; display: grid; gap: 14px; }
  .cam { position: relative; aspect-ratio: 1; background: #000; overflow: hidden; border: 2px solid var(--line-2); }
  .cam video { width: 100%; height: 100%; object-fit: cover; }
  .cam .frame { position: absolute; inset: 16%; border: 3px solid rgba(243,234,217,.8); box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; }
  .cam .off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
  .result { width: 100%; }
  .result.warn { background: #3a2a0d; border-color: var(--mustard); }
  .count { display: flex; justify-content: space-between; font: 700 12px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
</style>
<script src="config.js"></script>
</head>
<body class="staff">
<main class="door">
  <div class="sfield"><label for="ev">Tonight</label><select id="ev"><option value="">Any night</option></select></div>
  <div class="cam" id="cam"><video id="video" playsinline muted></video><div class="frame" hidden id="frame"></div>
    <div class="off" id="camOff"><div style="display:grid;gap:12px;justify-items:center"><button class="btn red" id="start">Scan QR</button><span class="foot-small">Uses the camera on this device.</span></div></div></div>
  <div id="out" aria-live="assertive"></div>
  <form id="manual" class="toolbar" style="margin:0" novalidate><input id="code" placeholder="Or paste the ticket link / token" style="flex:1;min-width:0" autocomplete="off" autocapitalize="off"><button class="sbtn" type="submit">Check</button></form>
  <div class="count"><span id="counted">0 in on this device</span><a href="admin.html" id="adminLink" hidden>Control room</a></div>
</main>
<script type="module" src="pages/checkin.js"></script>
</body>
</html>
