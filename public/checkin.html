<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Door · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memories">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<style>
  .door { max-width: 560px; margin: 0 auto; padding: 16px var(--gutter) 40px; display: grid; gap: 14px; }
  .headcount { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-block: 1px solid var(--line-2); padding: 10px 0; }
  .headcount b { font: 400 clamp(40px, 12vw, 64px)/1 var(--display); }
  .headcount small { font: 700 12px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .cam { position: relative; aspect-ratio: 1; background: #000; overflow: hidden; border: 2px solid var(--line-2); }
  .cam video { width: 100%; height: 100%; object-fit: cover; }
  .cam .frame { position: absolute; inset: 16%; border: 3px solid rgba(243,234,217,.8); box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; }
  .cam .off { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
  .cam .torch { position: absolute; right: 10px; top: 10px; min-height: 44px; }
  .result { width: 100%; }
  .result.warn { background: #3a2a0d; border-color: var(--mustard); }
  .result.offline { background: var(--ink-2); border-color: var(--line-2); }
  .result .admits { font: 400 clamp(64px, 22vw, 120px)/.9 var(--display); }
  .hits { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .hits li { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1.5px solid var(--line-2); padding: 10px 12px; }
  .hits button { min-height: 44px; }
  .count { display: flex; justify-content: space-between; font: 700 12px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  #ev:invalid { border-color: var(--crimson); }
</style>
<script src="config.js"></script>
</head>
<body class="staff">
<main class="door">
  <div class="sfield"><label for="ev">Night</label><select id="ev" required><option value="" disabled selected>Choose the night</option></select><span class="hint" id="evHint"></span></div>
  <div class="headcount" aria-live="polite"><div><small>In</small><br><b id="inCount">–</b></div><div style="text-align:right"><small>Expected</small><br><b id="expCount">–</b></div></div>
  <div id="out" aria-live="assertive"></div>
  <button class="btn red" id="next" type="button" hidden>Scan next</button>
  <div class="cam" id="cam"><video id="video" playsinline muted></video><div class="frame" hidden id="frame"></div>
    <button class="sbtn ghost torch" id="torch" type="button" hidden aria-pressed="false">Torch</button>
    <div class="off" id="camOff"><div style="display:grid;gap:12px;justify-items:center"><button class="btn red" id="start" type="button">Scan QR</button><span class="foot-small">Uses the camera on this device.</span></div></div></div>
  <form id="manual" class="toolbar" style="margin:0" novalidate><input id="code" placeholder="Or paste the ticket link" style="flex:1;min-width:0" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="sbtn" type="submit">Check</button></form>
  <details class="fold member-gate" id="memberGate"><summary>Staff or member at the gate?</summary>
    <form id="mPhone" class="step" novalidate style="margin-top:10px;gap:12px">
      <p class="foot-small" style="margin:0">Scan their Memories Pass above. Can’t scan? Type their number: a code appears on their Memories app (or their staff dashboard), and they read it to you.</p>
      <div class="sfield"><label for="mNum">Their phone</label><input id="mNum" type="tel" inputmode="tel" autocomplete="off" placeholder="024 123 4567"></div>
      <button class="sbtn red" type="submit">Send a code to their app</button>
    </form>
    <form id="mCode" class="step" novalidate hidden style="margin-top:10px;gap:12px">
      <div class="sfield"><label for="mCodeIn">The code they read out</label><input id="mCodeIn" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]*"></div>
      <div class="toolbar" style="margin:0"><button class="sbtn red" type="submit">Verify</button><button class="sbtn ghost" type="button" id="mCancel">Start over</button></div>
    </form>
  </details>
  <div class="sfield"><label for="search">Find a guest or table</label><input id="search" type="search" placeholder="Name, code or last 4 of phone" autocomplete="off"></div>
  <ul class="hits" id="hits"></ul>
  <div class="count"><span id="counted">This phone: 0</span><a href="admin.html" id="adminLink" hidden>Control room</a></div>
</main>
<script type="module" src="pages/checkin.js"></script>
</body>
</html>
