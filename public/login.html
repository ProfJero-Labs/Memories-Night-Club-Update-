<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff sign in · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<main class="center-screen" style="min-height:100vh">
  <form id="f" class="step" novalidate style="width:min(100%,420px)">
    <img src="assets/logo-sm.webp" alt="Memories" width="220" height="52" style="width:180px;height:auto">
    <h1 class="display" style="font-size:52px">Staff</h1>
    <div class="notice" id="msg" hidden role="alert"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn red" type="submit" id="go">Sign in</button>
    <button class="link" type="button" id="forgot" style="justify-self:start">Forgot password?</button>
    <p class="foot-small" style="margin:0">Staff accounts are created by the club. There’s no public sign-up.</p>
  </form>
</main>
<script type="module" src="pages/login.js"></script>
</body>
</html>
