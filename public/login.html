<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff sign in · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="manifest" href="staff.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-staff.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memories Staff">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<main class="center-screen" style="min-height:100vh">
  <div class="step signin" style="width:min(100%,420px)">
    <img src="assets/logo-sm.webp" alt="Memories" width="220" height="52" style="width:170px;height:auto">
    <h1 class="display" style="font-size:48px;margin:0" id="title">Staff sign in</h1>
    <div class="notice" id="msg" hidden role="alert"></div>

    <!-- 1. Phone + PIN -->
    <form id="pinForm" class="step" novalidate>
      <div class="field"><label for="phone">Your phone number</label><input id="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="024 123 4567"></div>
      <div class="field"><label for="pin">Your PIN</label><div class="pin-row"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" pattern="[0-9]*" placeholder="••••"><button type="button" class="link" id="showPin" aria-pressed="false">Show</button></div></div>
      <button class="btn red block" type="submit" id="go">Sign in</button>
      <button class="link" type="button" id="sendPin" style="justify-self:start">First time, or forgot your PIN? Text me one</button>
      <p class="muted" style="margin:0;font-size:14px">Your manager adds you and your PIN comes by text. You can change it after you sign in (tap your name).</p>
    </form>

    <!-- Older accounts: email + password -->
    <form id="f" class="step" novalidate hidden>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
      <button class="btn red block" type="submit" id="goEmail">Sign in</button>
      <button class="link" type="button" id="forgot" style="justify-self:start">Forgot password?</button>
      <button class="link" type="button" data-back style="justify-self:start">← Sign in with phone and PIN</button>
    </form>

    <button class="link" type="button" id="switch" hidden style="justify-self:start">Not you? Sign out</button>
    <button class="link" type="button" id="toEmail" style="justify-self:start;font-size:14px">Sign in with email instead</button>
    <p class="foot-small" style="margin:0">Staff accounts are added by a manager. There’s no public sign-up.</p>
  </div>
</main>
<script type="module" src="pages/login.js"></script>
</body>
</html>
