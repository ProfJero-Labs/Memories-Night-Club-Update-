<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Find my ticket · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<main class="wrap" style="max-width:720px">
  <header class="page-head" style="padding-bottom:18px"><p class="kicker red">Lost your ticket?</p><h1 class="display" style="font-size:clamp(56px,15vw,130px)">Find my ticket</h1></header>
  <form id="find" class="step" novalidate>
    <div class="field"><label for="phone">The phone number you bought with</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="024 123 4567"><span class="hint">We text the ticket links to that number, never to another.</span></div>
    <button class="btn red" type="submit" id="go">Text me my tickets <span class="arrow">→</span></button>
    <div class="notice" id="msg" hidden role="status"></div>
  </form>
  <p class="muted" style="margin-top:28px">Paying in bits? <a href="installment.html">Pay the rest</a> has your order.</p>
</main>
<script type="module" src="pages/find.js"></script>
</body>
</html>
