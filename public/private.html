<style>
  .dates { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .dates button { display: grid; gap: 2px; justify-items: center; padding: 12px 6px 10px; background: var(--ink-2); border: 1.5px solid var(--line-2); line-height: 1; }
  .dates b { font: 400 30px var(--display); }
  .dates small { font: 700 10px var(--sans); letter-spacing: .2em; color: var(--muted); }
  .dates button[aria-checked="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .dates button[aria-checked="true"] small { color: var(--burgundy); }
  .dates button:disabled { opacity: .35; text-decoration: line-through; }
  .flow-narrow { max-width: 720px; }
</style>
