<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pay the rest · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<style>.plan { border: 1.5px solid var(--line-2); padding: 20px; display: grid; gap: 14px; } .quick { display: flex; gap: 8px; flex-wrap: wrap; } .quick button { min-height: 44px; padding: 0 14px; background: none; border: 1.5px solid var(--line-2); font-weight: 700; }</style>
<script src="config.js"></script>
</head>
<body>
<main class="wrap" style="max-width:720px">
  <header class="page-head" style="padding-bottom:18px"><p class="kicker red">Pay in bits</p><h1 class="display" style="font-size:clamp(60px,16vw,140px)">Pay the rest</h1></header>
  <form id="find" class="step" novalidate>
    <div class="field"><label for="q">Order code or phone number</label><input id="q" autocapitalize="characters" placeholder="MEM-AB1234 or 024 123 4567"><span class="hint">It’s in the text we sent when you started.</span></div>
    <button class="btn red" type="submit">Find my order <span class="arrow">→</span></button>
  </form>
  <div id="root" style="margin-top:30px"></div>
</main>
<script type="module">
import { chrome, api, esc, params, money, $, $$, shortDate } from './app.js';
chrome();
const root = $('#root');

function planCard(p) {
  const left = p.totalPesewas - p.paidPesewas, pct = Math.round(100 * p.paidPesewas / p.totalPesewas);
  const head = `<div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><span class="kicker">${esc(p.planId)}</span><span class="kicker">${p.eventDate ? esc(shortDate(p.eventDate)) : ''}</span></div>
    <h2 class="display sm">${esc(p.eventName)}</h2>
    <span class="muted">${p.quantity} × ${esc(p.ticketTypeName)}${p.identityLine ? ` · “${esc(p.identityLine)}”` : ''}</span>
    <div class="draw-meter" style="height:12px"><i style="width:${pct}%;background:var(--crimson)"></i></div>
    <div style="display:flex;justify-content:space-between"><span>${money(p.paidPesewas)} paid</span><b>${money(p.totalPesewas)}</b></div>`;
  if (p.status === 'completed') return `<div class="plan">${head}<div class="notice ok">Paid in full.</div>${p.ticketIds.map((t, i) => `<a class="btn paper" href="ticket.html?token=${encodeURIComponent(t)}">Open ticket${p.ticketIds.length > 1 ? ` ${i + 1}` : ''} <span class="arrow">→</span></a>`).join('')}</div>`;
  if (p.status !== 'active') return `<div class="plan">${head}<div class="notice">${p.status === 'forfeited' ? 'This order was forfeited: the night started before it was fully paid.' : 'This order is closed. Contact us.'}</div></div>`;
  const min = Math.min(1000, left);
  return `<form class="plan" data-plan="${esc(p.planId)}" data-left="${left}" novalidate>${head}
    <h3 class="display" style="font-size:34px">${money(left)} to go</h3>
    <div class="quick"><button type="button" data-amt="${left}">All of it · ${money(left)}</button>${left >= 2000 ? `<button type="button" data-amt="${Math.round(left / 200) * 100}">Half · ${money(Math.round(left / 200) * 100)}</button>` : ''}</div>
    <div class="field"><label for="amt-${esc(p.planId)}">Pay now</label><div class="money-in"><input id="amt-${esc(p.planId)}" type="number" inputmode="decimal" min="${min / 100}" max="${left / 100}" step="1" placeholder="${min / 100}"></div><span class="hint">Anyone can pay this. The ticket goes to ${esc(p.firstName)} when it’s fully paid.</span></div>
    <div class="notice" hidden role="alert"></div>
    <button class="btn red" type="submit">Pay <span class="arrow">→</span></button></form>`;
}

async function find(q) {
  root.innerHTML = '<div class="loading" role="status">FINDING YOUR ORDER…</div>';
  const isCode = /^mem-/i.test(q.trim());
  try {
    const { plans } = await api(`/api/installments/lookup?${isCode ? 'code' : 'phone'}=${encodeURIComponent(q.trim())}`);
    if (!plans.length) { root.innerHTML = `<div class="notice">No order found for that ${isCode ? 'code' : 'number'}. Check the text we sent you.</div>`; return; }
    root.innerHTML = `<div style="display:grid;gap:18px">${plans.sort((a, b) => (a.status === 'active' ? -1 : 1) - (b.status === 'active' ? -1 : 1)).map(planCard).join('')}</div>`;
    bind();
  } catch (e) { root.innerHTML = `<div class="notice" role="alert">${esc(e.message)}</div>`; }
}

function bind() {
  $$('form[data-plan]').forEach(f => {
    const input = $('input', f), note = $('.notice', f), btn = $('button[type=submit]', f);
    const sync = () => { const v = Math.round(Number(input.value || 0) * 100); btn.innerHTML = v ? `Pay ${money(v)} <span class="arrow">→</span>` : 'Pay <span class="arrow">→</span>'; };
    $$('[data-amt]', f).forEach(b => b.onclick = () => { input.value = Number(b.dataset.amt) / 100; sync(); });
    input.oninput = sync;
    f.onsubmit = async ev => {
      ev.preventDefault(); note.hidden = true;
      const v = Math.round(Number(input.value || 0) * 100), left = Number(f.dataset.left);
      if (!v || v < Math.min(1000, left) || v > left) { note.hidden = false; note.textContent = `Pay between ${money(Math.min(1000, left))} and ${money(left)}.`; return input.focus(); }
      btn.disabled = true; btn.textContent = 'Opening payment…';
      try { const d = await api('/api/installments/topup', { method: 'POST', body: { planId: f.dataset.plan, amountPesewas: v, callbackUrl: `${location.origin}/payment-return.html` } }); location.href = d.authorizationUrl; }
      catch (e) { note.hidden = false; note.textContent = e.message; btn.disabled = false; sync(); }
    };
  });
}

$('#find').onsubmit = ev => { ev.preventDefault(); const q = $('#q').value; if (q.trim()) find(q); };
const code = params.get('code');
if (code) { $('#q').value = code; find(code); }
</script>
</body>
</html>
