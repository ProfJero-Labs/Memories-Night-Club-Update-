<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pay the rest · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<style>.plan { border: 1.5px solid var(--line-2); padding: 20px; display: grid; gap: 14px; } .quick { display: flex; gap: 8px; flex-wrap: wrap; } .quick button { min-height: 44px; padding: 0 14px; background: none; border: 1.5px solid var(--line-2); font-weight: 700; }</style>
<script src="config.js"></script>
</head>
<body>
<main class="wrap" style="max-width:720px">
  <header class="page-head" style="padding-bottom:18px"><p class="kicker red">Pay in bits</p><h1 class="display" style="font-size:clamp(60px,16vw,140px)">Pay the rest</h1></header>
  <form id="find" class="step" novalidate>
    <div class="field"><label for="q">Order code</label><input id="q" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="MEM-7K3QX-9WP2M"><span class="hint">It’s in the text we sent when you started.</span></div>
    <button class="btn red" type="submit">Find my order <span class="arrow">→</span></button>
  </form>
  <details class="lost" style="margin-top:18px"><summary class="label" style="cursor:pointer;padding:6px 0">Lost your code?</summary>
    <form id="lost" class="step" novalidate style="margin-top:10px">
      <div class="field"><label for="lostPhone">The phone number you used</label><input id="lostPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="024 123 4567"></div>
      <button class="btn" type="submit">Text me my codes</button>
      <div class="notice" id="lostMsg" hidden role="status"></div>
    </form>
  </details>
  <div id="root" style="margin-top:30px"></div>
</main>
<script type="module" src="pages/installment.js"></script>
</body>
</html>
