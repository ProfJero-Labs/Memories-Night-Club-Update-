<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get in · Memories</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .peek { position: relative; max-height: 230px; overflow: hidden; margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter); }
  .peek::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, var(--ink)); }
  .peek .ticket { --w: 340px; }
  .peek .t-main { min-height: 0; }
  @media (min-width: 960px) { .peek { display: none; } }
  .aside { display: none; }
  @media (min-width: 960px) { .aside { display: block; } }
  @media (min-width: 960px) { .review-ticket { display: none; } }
  .for { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
</style>
<script src="config.js"></script>
</head>
<body>
<main class="wrap"><div id="root"><div class="loading" role="status">GETTING YOUR TICKET READY…</div></div></main>
<script type="module" src="pages/checkout.js"></script>
</body>
</html>
