<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEMORIES · Login</title>

    <!-- ====== Tailwind CSS ====== -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- ====== Google Fonts ====== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />

    <!-- ====== Font Awesome 6 ====== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- ====== Firebase SDKs ====== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js"></script>

    <!-- ====== Custom Tailwind Configuration ====== -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: "#E91E63",
                            light: "#ffb1c8",
                            dark: "#a80d45",
                        },
                        surface: {
                            DEFAULT: "#1a1114",
                            card: "#0c0c0c",
                            elevated: "#1f1f1f",
                        },
                        onSurface: {
                            DEFAULT: "#f0dfe3",
                            muted: "#c6c6c7",
                        },
                    },
                    fontFamily: {
                        serif: ['"Bodoni Moda"', "serif"],
                        sans: ['"Hanken Grotesk"', "sans-serif"],
                    },
                },
            },
        };
    </script>

    <!-- ====== Custom Styles ====== -->
    <style>
        body {
            background-color: #0a0a0a;
            font-family: "Hanken Grotesk", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
            position: relative;
        }

        /* ── Animated wave background (matches the ticket design) ── */
        .wave-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, rgba(233, 30, 99, 0.15) 0%, rgba(0, 0, 0, 0) 60%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" opacity="0.1"><path d="M0,50 Q25,30 50,50 T100,50" stroke="%23E91E63" fill="none" stroke-width="2"/><path d="M0,60 Q25,40 50,60 T100,60" stroke="%23E91E63" fill="none" stroke-width="1.5"/><path d="M0,70 Q25,50 50,70 T100,70" stroke="%23E91E63" fill="none" stroke-width="1"/></svg>');
            background-size: cover;
            background-position: center;
        }

        /* ── Glassmorphism card ── */
        .glass-card {
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        /* ── Input focus glow ── */
        .input-glow:focus {
            border-color: #E91E63;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.2), 0 0 20px rgba(233, 30, 99, 0.1);
        }

        /* ── Button gradient hover ── */
        .btn-primary {
            background: linear-gradient(135deg, #E91E63, #b0104a);
            transition: all 0.3s ease;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.35);
            filter: brightness(1.1);
        }
        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* ── Eye icon inside input ── */
        .toggle-pw {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9ca3af;
            transition: color 0.2s;
            z-index: 10;
        }
        .toggle-pw:hover {
            color: #f3f4f6;
        }

        /* ── Brand text glow ── */
        .brand-glow {
            text-shadow: 0 0 40px rgba(233, 30, 99, 0.3), 0 0 80px rgba(233, 30, 99, 0.1);
        }

        /* ── Spinner animation ── */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ── Responsive adjustments ── */
        @media (max-width: 480px) {
            .glass-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ====== BACKGROUND ====== -->
    <div class="wave-bg"></div>

    <!-- ====== LOGIN CARD ====== -->
    <main class="relative z-10 w-full max-w-md mx-auto">
        <div class="glass-card rounded-3xl p-8 md:p-10">

            <!-- Brand Header -->
            <div class="text-center mb-8">
                <h1 class="font-serif text-5xl font-bold text-primary tracking-widest brand-glow">
                    MEMORIES
                </h1>
                <p class="text-xs tracking-[0.3em] text-onSurface-muted uppercase mt-2 font-sans font-medium">
                    Some nights are forever
                </p>
                <div class="w-12 h-0.5 bg-primary/60 mx-auto mt-4 rounded-full"></div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" autocomplete="off" class="space-y-6">
                <!-- Email -->
                <div class="space-y-1.5">
                    <label for="email" class="text-sm font-medium text-onSurface-muted block">
                        <i class="fas fa-envelope mr-2 text-primary/70 w-4"></i>Email Address
                    </label>
                    <div class="relative">
                        <input type="email" id="email" name="email"
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder:text-white/30 focus:outline-none input-glow transition-all duration-200"
                        placeholder="admin@memories.com" required autofocus />
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1.5">
                    <label for="password" class="text-sm font-medium text-onSurface-muted block">
                        <i class="fas fa-lock mr-2 text-primary/70 w-4"></i>Password
                    </label>
                    <div class="relative">
                        <input type="password" id="password" name="password"
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder:text-white/30 focus:outline-none input-glow transition-all duration-200 pr-12"
                        placeholder="Enter your password" required />
                        <!-- Toggle Visibility Icon -->
                        <i class="fas fa-eye toggle-pw" id="toggleIcon" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <!-- Forgot Password & Options (UI only) -->
                <div class="flex items-center justify-between text-sm">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="remember" class="accent-primary w-4 h-4 bg-white/5 border-white/10 rounded focus:ring-primary focus:ring-1" />
                        <label for="remember" class="text-onSurface-muted cursor-pointer">Remember me</label>
                    </div>
                    <a href="#" class="text-primary/80 hover:text-primary transition-colors font-medium">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn"
                class="btn-primary w-full text-white font-bold py-3.5 rounded-xl text-lg tracking-wider uppercase shadow-lg transition-all duration-200 flex items-center justify-center gap-3">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In
            </button>

            <!-- Error Message Area -->
            <div id="loginError" class="mt-4 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-sm hidden transition-all duration-300">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="errorMessage">Invalid credentials. Please try again.</span>
            </div>
        </form>
    </div>

    <!-- Footer / Version -->
    <p class="absolute bottom-4 left-0 right-0 text-center text-[10px] text-onSurface-muted/30 tracking-widest font-sans z-10">
        MEMORIES NIGHT CLUB · CAPE COAST
    </p>
</main>

<!-- ====== JAVASCRIPT ====== -->
<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCkhFjqfTqCIg9ic5Qh63XfWVT4tGWuzpM",
        authDomain: "memoriesnightclub-2717f.firebaseapp.com",
        projectId: "memoriesnightclub-2717f",
        storageBucket: "memoriesnightclub-2717f.firebasestorage.app",
        messagingSenderId: "143491627943",
        appId: "1:143491627943:web:7cb70bfabdefda7e8a5482",
        measurementId: "G-9RQQCZ7EVD"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ============================================================
    // DOM REFERENCES
    // ============================================================
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorDiv = document.getElementById('loginError');
    const errorMsg = document.getElementById('errorMessage');

    // ============================================================
    // AUTH STATE OBSERVER – redirect if already logged in
    // ============================================================
    auth.onAuthStateChanged((user) => {
        if (user) {
            // User is already signed in → redirect to dashboard
            window.location.href = '/event/dashboard.html';
        }
    });

    // ============================================================
    // TOGGLE PASSWORD VISIBILITY
    // ============================================================
    function togglePasswordVisibility() {
        const icon = document.getElementById('toggleIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // ============================================================
    // LOGIN FORM SUBMISSION
    // ============================================================
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        // Reset error
        errorDiv.classList.add('hidden');

        // Basic validation
        if (!email || !password) {
            showError('Please enter both email and password.');
            return;
        }

        // Show loading state
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner"></span> Signing In...';

        try {
            // Attempt Firebase Authentication
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // Success – redirect to dashboard
            // The onAuthStateChanged listener will handle the redirect,
            // but we also do it directly here for immediate feedback.
            window.location.href = '/event/dashboard.html';

        } catch (error) {
            // Handle Firebase Auth errors
            let friendlyMessage = 'Login failed. Please try again.';

            switch (error.code) {
                case 'auth/user-not-found':
                    friendlyMessage = 'No account found with this email address.';
                    break;
                case 'auth/wrong-password':
                    friendlyMessage = 'Incorrect password. Please try again.';
                    break;
                case 'auth/invalid-email':
                    friendlyMessage = 'Please enter a valid email address.';
                    break;
                case 'auth/too-many-requests':
                    friendlyMessage = 'Too many failed attempts. Please try again later.';
                    break;
                case 'auth/network-request-failed':
                    friendlyMessage = 'Network error. Please check your connection.';
                    break;
                default:
                    friendlyMessage = error.message || 'Login failed. Please try again.';
            }

            showError(friendlyMessage);
            console.error('Firebase Auth Error:', error.code, error.message);

        } finally {
            // Reset button state (only if not redirected)
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
        }
    });

    // ============================================================
    // HELPER: Show error message
    // ============================================================
    function showError(message) {
        errorMsg.textContent = message;
        errorDiv.classList.remove('hidden');
        // Auto-hide after 6 seconds
        clearTimeout(window._errorTimeout);
        window._errorTimeout = setTimeout(() => {
            errorDiv.classList.add('hidden');
        }, 6000);
    }

    // ============================================================
    // (Optional) Enter key submits form – already handled by form submit
    // ============================================================
    console.log('✅ Firebase Auth login page ready.');
</script>
</body>
</html>
