<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Status · MEMORIES</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        :root {
            --bg: #0a0809;
            --surface: #141012;
            --surface-2: #1d181a;
            --border: #2a1f22;
            --primary: #e91e63;
            --primary-light: #ffb1c8;
            --ink: #ece0e3;
            --ink-muted: #a89096;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Hanken Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(233,30,99,0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 100%, rgba(233,30,99,0.06) 0%, transparent 50%);
        }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
        .glass-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .spinner-lg {
            width: 64px;
            height: 64px;
            border: 4px solid rgba(233,30,99,0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-icon {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
            animation: pop-in 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pop-in {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .icon-success { background: rgba(74,222,128,0.15); color: #4ade80; border: 2px solid rgba(74,222,128,0.4); }
        .icon-pending { background: rgba(255,171,64,0.15); color: #ffab40; border: 2px solid rgba(255,171,64,0.4); }
        .icon-error { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 2px solid rgba(255,107,107,0.4); }
        .btn-primary {
            background: linear-gradient(135deg, #ffb1c8, #e91e63);
            color: #08080A;
            font-weight: 700;
            padding: 0.9rem 1.75rem;
            border-radius: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(233,30,99,0.35);
            font-family: inherit;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(233,30,99,0.5);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--ink);
            padding: 0.9rem 1.75rem;
            border-radius: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            transition: all 0.2s;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary-light);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.65rem 0;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label { color: var(--ink-muted); }
        .detail-row .value { font-weight: 600; }
        .ticket-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
            text-align: left;
        }
        .ticket-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(233,30,99,0.15);
        }
        .ticket-card .ticket-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(233,30,99,0.12);
            color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        .ticket-card .ticket-info { flex: 1; min-width: 0; }
        .ticket-card .ticket-info .name {
            font-weight: 600;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ticket-card .ticket-info .id {
            font-size: 0.75rem;
            color: var(--ink-muted);
            font-family: monospace;
        }
        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 1.5s ease-in-out infinite;
            margin-right: 6px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0.35rem 0.9rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-pill.verifying { background: rgba(233,30,99,0.12); color: var(--primary-light); }
        .status-pill.success { background: rgba(74,222,128,0.15); color: #4ade80; }
        .status-pill.pending { background: rgba(255,171,64,0.15); color: #ffab40; }
        .status-pill.failed { background: rgba(255,107,107,0.15); color: #ff6b6b; }
    </style>
</head>
<body>

    <div class="glass-card" id="card">
        <!-- Header -->
        <div class="mb-6">
            <h2 class="font-bebas text-2xl" style="color: var(--primary-light);">MEMORIES</h2>
            <p class="text-[10px] tracking-[0.3em] uppercase" style="color: var(--ink-muted);">Some nights are forever</p>
        </div>

        <!-- Spinner -->
        <div id="spinner" class="spinner-lg"></div>

        <!-- Status icon (replaces spinner on completion) -->
        <div id="statusIcon" style="display: none;"></div>

        <!-- Title & message -->
        <h1 class="font-bebas text-3xl mb-2" id="title">VERIFYING PAYMENT</h1>
        <p class="text-sm mb-6" style="color: var(--ink-muted);" id="message">
            Please wait while we confirm your payment and issue your tickets...
        </p>

        <!-- Reference -->
        <div class="mb-4" id="refContainer" style="display: none;">
            <div class="status-pill verifying" id="statusPill">
                <span class="pulse-dot"></span>
                <span id="pillText">Processing</span>
            </div>
        </div>

        <!-- Details -->
        <div id="details" style="display: none; margin-bottom: 1.5rem; background: var(--surface-2); padding: 1rem; border-radius: 12px;">
            <div class="detail-row">
                <span class="label">Reference</span>
                <span class="value" id="refValue" style="font-family: monospace; font-size: 0.8rem;">—</span>
            </div>
            <div class="detail-row">
                <span class="label">Amount Paid</span>
                <span class="value" id="amountValue">—</span>
            </div>
            <div class="detail-row">
                <span class="label">Tickets Issued</span>
                <span class="value" id="ticketsValue">—</span>
            </div>
        </div>

        <!-- Ticket list (populated on success) -->
        <div id="ticketsList" style="display: none; margin-bottom: 1.5rem; text-align: left;"></div>

        <!-- Actions -->
        <div id="actions" style="display: none; display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
            <button class="btn-primary" id="viewTicketsBtn" style="display: none;">
                <i class="fas fa-ticket-alt"></i> View Ticket
            </button>
            <a href="events.html" class="btn-outline" id="backBtn" style="display: none;">
                <i class="fas fa-arrow-left"></i> Browse Events
            </a>
            <button class="btn-outline" id="retryBtn" style="display: none;">
                <i class="fas fa-redo"></i> Check Again
            </button>
        </div>

        <!-- Footer -->
        <p class="text-[10px] tracking-[0.2em] uppercase mt-6" style="color: var(--ink-muted);">
            Secure payments by <span style="color: var(--primary-light);">Paystack</span>
        </p>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const WORKER_URL = 'https://memories-paystack-verify.diamondj04102026.workers.dev';
        const TICKET_PAGE = 'ticket.html';

        // ============================================================
        // STATE
        // ============================================================
        const params = new URLSearchParams(window.location.search);
        // Paystack returns ?reference=XXX or ?trxref=XXX
        const reference = params.get('reference') || params.get('trxref');

        let pollCount = 0;
        const MAX_POLLS = 25;      // 25 * 2s = 50s max polling
        const POLL_INTERVAL = 2000; // 2 seconds

        let verifyAttempted = false;
        let pollTimer = null;

        // ============================================================
        // HELPERS
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatGHS(pesewas) {
            if (!pesewas && pesewas !== 0) return '—';
            return 'GHS ' + (pesewas / 100).toFixed(2);
        }

        function setPill(type, text) {
            const pill = document.getElementById('statusPill');
            const pillText = document.getElementById('pillText');
            pill.className = 'status-pill ' + type;
            pillText.textContent = text;
            document.getElementById('refContainer').style.display = 'block';
        }

        // ============================================================
        // STATE MACHINE
        // ============================================================
        function setState(state, opts = {}) {
            const spinner = document.getElementById('spinner');
            const statusIcon = document.getElementById('statusIcon');
            const title = document.getElementById('title');
            const message = document.getElementById('message');
            const actions = document.getElementById('actions');
            const details = document.getElementById('details');
            const ticketsList = document.getElementById('ticketsList');

            spinner.style.display = 'none';
            statusIcon.style.display = 'none';

            if (state === 'verifying') {
                spinner.style.display = 'block';
                title.textContent = 'VERIFYING PAYMENT';
                message.textContent = 'Please wait while we confirm your payment and issue your tickets...';
                setPill('verifying', 'Processing');
                document.getElementById('refValue').textContent = reference || '—';
                details.style.display = 'block';
                actions.style.display = 'none';
                ticketsList.style.display = 'none';

            } else if (state === 'issuing') {
                spinner.style.display = 'block';
                title.textContent = 'ISSUING TICKETS';
                message.textContent = 'Payment confirmed! Now issuing your tickets...';
                setPill('verifying', 'Issuing');
                details.style.display = 'block';
                actions.style.display = 'none';
                ticketsList.style.display = 'none';

            } else if (state === 'success') {
                statusIcon.style.display = 'flex';
                statusIcon.className = 'status-icon icon-success';
                statusIcon.innerHTML = '<i class="fas fa-check"></i>';
                title.textContent = 'PAYMENT SUCCESSFUL';
                message.textContent = opts.message || 'Your tickets have been issued and sent to your phone!';
                setPill('success', 'Issued');
                details.style.display = 'block';
                ticketsList.style.display = 'block';
                actions.style.display = 'flex';

                // Build ticket cards
                let ticketsHtml = '';
                if (opts.tickets && opts.tickets.length > 0) {
                    ticketsHtml += `<p class="text-xs mb-2" style="color: var(--ink-muted); text-align: left;">
                        <i class="fas fa-ticket-alt mr-1" style="color: var(--primary-light);"></i>
                        ${opts.tickets.length} ticket${opts.tickets.length > 1 ? 's' : ''} issued
                    </p>`;
                    opts.tickets.forEach((t, i) => {
                        ticketsHtml += `
                            <a href="${TICKET_PAGE}?token=${encodeURIComponent(t.token)}" class="ticket-card">
                                <div class="ticket-icon"><i class="fas fa-ticket-alt"></i></div>
                                <div class="ticket-info">
                                    <div class="name">Ticket ${i + 1}</div>
                                    <div class="id">${escapeHtml(t.ticketId || t.token.substring(0, 12))}</div>
                                </div>
                                <i class="fas fa-chevron-right" style="color: var(--ink-muted);"></i>
                            </a>
                        `;
                    });
                } else {
                    ticketsHtml = `<p class="text-xs text-center" style="color: var(--ink-muted);">
                        Check your SMS for your ticket link.
                    </p>`;
                }
                ticketsList.innerHTML = ticketsHtml;

                // Wire up "View Ticket" button
                const viewBtn = document.getElementById('viewTicketsBtn');
                if (opts.tickets && opts.tickets.length > 0) {
                    viewBtn.style.display = 'inline-flex';
                    viewBtn.onclick = () => {
                        window.location.href = `${TICKET_PAGE}?token=${encodeURIComponent(opts.tickets[0].token)}`;
                    };
                } else {
                    viewBtn.style.display = 'none';
                }

                document.getElementById('backBtn').style.display = 'inline-flex';
                document.getElementById('retryBtn').style.display = 'none';

            } else if (state === 'pending') {
                statusIcon.style.display = 'flex';
                statusIcon.className = 'status-icon icon-pending';
                statusIcon.innerHTML = '<i class="fas fa-clock"></i>';
                title.textContent = 'PAYMENT PENDING';
                message.textContent = 'Your payment is being processed. This can take a few moments.';
                setPill('pending', 'Pending');
                details.style.display = 'block';
                ticketsList.style.display = 'none';
                actions.style.display = 'flex';
                document.getElementById('viewTicketsBtn').style.display = 'none';
                document.getElementById('backBtn').style.display = 'inline-flex';
                document.getElementById('retryBtn').style.display = 'inline-flex';

            } else if (state === 'failed') {
                statusIcon.style.display = 'flex';
                statusIcon.className = 'status-icon icon-error';
                statusIcon.innerHTML = '<i class="fas fa-times"></i>';
                title.textContent = 'PAYMENT FAILED';
                message.textContent = opts.error || 'We could not confirm your payment. Please try again.';
                setPill('failed', 'Failed');
                details.style.display = 'block';
                ticketsList.style.display = 'none';
                actions.style.display = 'flex';
                document.getElementById('viewTicketsBtn').style.display = 'none';
                document.getElementById('backBtn').style.display = 'inline-flex';
                document.getElementById('retryBtn').style.display = 'inline-flex';
            }
        }

        function setDetails(data) {
            if (data.reference) document.getElementById('refValue').textContent = data.reference;
            if (data.amountPesewas) document.getElementById('amountValue').textContent = formatGHS(data.amountPesewas);
            if (data.ticketCount !== undefined) document.getElementById('ticketsValue').textContent = data.ticketCount;
        }

        // ============================================================
        // POLLING LOGIC
        // ============================================================
        async function pollStatus() {
            if (!reference) {
                setState('failed', { error: 'No payment reference provided' });
                return;
            }

            pollCount++;

            try {
                // First, check status without triggering issuance
                const statusResp = await fetch(`${WORKER_URL}/ticket-checkout/status?reference=${encodeURIComponent(reference)}`);
                const statusData = await statusResp.json();

                if (!statusData.success) {
                    throw new Error(statusData.error || 'Status check failed');
                }

                setDetails(statusData);

                if (statusData.status === 'issued') {
                    // Success! Tickets already issued
                    setState('success', {
                        tickets: statusData.tickets,
                        message: 'Your tickets are ready!'
                    });
                    return;
                }

                // If pending and we haven't tried verify yet, call verify once
                if (!verifyAttempted && pollCount >= 2) {
                    verifyAttempted = true;
                    setState('issuing');
                    await callVerify();
                    return;
                }

                // Keep polling
                if (pollCount < MAX_POLLS) {
                    setState('verifying');
                    pollTimer = setTimeout(pollStatus, POLL_INTERVAL);
                } else {
                    setState('pending');
                }

            } catch (error) {
                console.error('Poll error:', error);
                if (pollCount < MAX_POLLS) {
                    pollTimer = setTimeout(pollStatus, POLL_INTERVAL);
                } else {
                    setState('failed', { error: error.message });
                }
            }
        }

        async function callVerify() {
            try {
                const verifyResp = await fetch(`${WORKER_URL}/ticket-checkout/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reference })
                });

                const verifyData = await verifyResp.json();

                if (verifyData.status === 'issued') {
                    setDetails(verifyData);
                    setState('success', {
                        tickets: verifyData.tickets,
                        message: 'Payment confirmed and tickets issued!'
                    });
                    return;
                }

                if (verifyData.status === 'failed') {
                    setState('failed', { error: verifyData.error || 'Payment was not successful' });
                    return;
                }

                // Still pending - continue polling
                if (pollCount < MAX_POLLS) {
                    setState('verifying');
                    pollTimer = setTimeout(pollStatus, POLL_INTERVAL);
                } else {
                    setState('pending');
                }

            } catch (error) {
                console.error('Verify error:', error);
                // Fallback to polling
                if (pollCount < MAX_POLLS) {
                    pollTimer = setTimeout(pollStatus, POLL_INTERVAL);
                } else {
                    setState('pending');
                }
            }
        }

        // ============================================================
        // RETRY
        // ============================================================
        document.getElementById('retryBtn').addEventListener('click', () => {
            if (pollTimer) clearTimeout(pollTimer);
            pollCount = 0;
            verifyAttempted = false;
            setState('verifying');
            pollStatus();
        });

        // ============================================================
        // INIT
        // ============================================================
        window.addEventListener('beforeunload', () => {
            if (pollTimer) clearTimeout(pollTimer);
        });

        if (!reference) {
            setState('failed', { error: 'No payment reference found in URL' });
        } else {
            // Set initial state and start polling after a short delay
            setState('verifying');
            document.getElementById('refValue').textContent = reference;
            setTimeout(pollStatus, 1200);
        }
    </script>
</body>
</html>
