<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events · MEMORIES</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore-compat.min.js"></script>

    <style>
        :root {
            --bg: #0a0809;
            --surface: #141012;
            --surface-2: #1d181a;
            --border: #2a1f22;
            --primary: #e91e63;
            --primary-light: #ffb1c8;
            --ink: #ece0e3;
            --ink-muted: #a89096;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Hanken Grotesk', sans-serif;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 20% 10%, rgba(233,30,99,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(233,30,99,0.05) 0%, transparent 50%);
        }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
        .event-card {
            background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            cursor: pointer;
        }
        .event-card:hover {
            border-color: rgba(233,30,99,0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(233,30,99,0.15);
        }
        .event-card .artwork {
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #703348 0%, #e91e63 100%);
            position: relative;
            overflow: hidden;
        }
        .event-card .artwork::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 3px, transparent 3px 6px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffb1c8, #e91e63);
            color: #08080A;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 4px 20px rgba(233,30,99,0.35);
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(233,30,99,0.5);
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .status-published { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
        .status-soldout { background: rgba(255,171,64,0.15); color: #ffab40; border: 1px solid rgba(255,171,64,0.3); }
        .status-ended { background: rgba(168,144,150,0.15); color: #a89096; border: 1px solid rgba(168,144,150,0.3); }
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--ink-muted);
        }
        .empty-state i { font-size: 3rem; opacity: 0.3; margin-bottom: 1rem; }
        .skeleton {
            background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 16px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="border-b" style="border-color: var(--border); background: rgba(10,8,9,0.8); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50;">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
            <div>
                <h1 class="font-bebas text-3xl" style="color: var(--primary-light); text-shadow: 0 0 40px rgba(233,30,99,0.3);">MEMORIES</h1>
                <p class="text-[10px] tracking-[0.3em] uppercase" style="color: var(--ink-muted);">Some nights are forever</p>
            </div>
            <a href="ticket.html" class="text-sm" style="color: var(--ink-muted);">
                <i class="fas fa-ticket-alt mr-2"></i>My Tickets
            </a>
        </div>
    </header>

    <!-- Hero -->
    <section class="max-w-6xl mx-auto px-5 pt-12 pb-8">
        <p class="text-xs tracking-[0.3em] uppercase mb-3" style="color: var(--primary);">Upcoming Events</p>
        <h2 class="font-bebas text-5xl md:text-6xl leading-none mb-3">EXPERIENCE THE NIGHT</h2>
        <p class="text-sm max-w-lg" style="color: var(--ink-muted);">
            Secure your spot at the hottest events at Memories Night Club. Purchase online, receive instant ticket on WhatsApp/SMS.
        </p>
    </section>

    <!-- Events Grid -->
    <main class="max-w-6xl mx-auto px-5 pb-20">
        <div id="eventsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Skeletons -->
            <div class="skeleton h-80"></div>
            <div class="skeleton h-80"></div>
            <div class="skeleton h-80"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t py-8" style="border-color: var(--border);">
        <div class="max-w-6xl mx-auto px-5 text-center">
            <p class="text-xs tracking-[0.3em] uppercase" style="color: var(--ink-muted);">MEMORIES NIGHT CLUB · CAPE COAST</p>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkhFjqfTqCIg9ic5Qh63XfWVT4tGWuzpM",
            authDomain: "memoriesnightclub-2717f.firebaseapp.com",
            projectId: "memoriesnightclub-2717f",
            storageBucket: "memoriesnightclub-2717f.firebasestorage.app",
            messagingSenderId: "143491627943",
            appId: "1:143491627943:web:7cb70bfabdefda7e8a5482",
            measurementId: "G-9RQQCZ7EVD"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(ts) {
            if (!ts) return 'Date TBA';
            const date = ts.toDate ? ts.toDate() : new Date(ts);
            return date.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getStatus(event) {
            const now = new Date();
            if (event.status === 'sold_out') return { label: 'Sold Out', cls: 'status-soldout' };
            if (event.endsAt) {
                const end = event.endsAt.toDate ? event.endsAt.toDate() : new Date(event.endsAt);
                if (end < now) return { label: 'Ended', cls: 'status-ended' };
            }
            return { label: 'On Sale', cls: 'status-published' };
        }

        async function loadEvents() {
            const grid = document.getElementById('eventsGrid');
            try {
                const snapshot = await db.collection('events')
                    .where('active', '==', true)
                    .orderBy('startsAt', 'asc')
                    .get();

                if (snapshot.empty) {
                    grid.innerHTML = `
                        <div class="empty-state col-span-full">
                            <i class="fas fa-calendar-times block"></i>
                            <p>No events available at the moment</p>
                            <p class="text-xs mt-2">Check back soon</p>
                        </div>`;
                    return;
                }

                const events = [];
                snapshot.forEach(doc => events.push({ id: doc.id, ...doc.data() }));

                // Filter: show published or on-sale events
                const visible = events.filter(e => 
                    !e.status || e.status === 'published' || e.status === 'on_sale' || e.status === 'sold_out'
                );

                if (visible.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state col-span-full">
                            <i class="fas fa-calendar-times block"></i>
                            <p>No events available at the moment</p>
                        </div>`;
                    return;
                }

                let html = '';
                visible.forEach(ev => {
                    const status = getStatus(ev);
                    const dateStr = formatDate(ev.startsAt);
                    html += `
                        <div class="event-card" onclick="window.location.href='event-detail.html?id=${escapeHtml(ev.id)}'">
                            <div class="artwork">
                                ${ev.artworkUrl ? `<img src="${escapeHtml(ev.artworkUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;" />` : ''}
                                <div style="position:absolute;top:1rem;right:1rem;z-index:2;">
                                    <span class="status-badge ${status.cls}">${status.label}</span>
                                </div>
                            </div>
                            <div class="p-5">
                                <p class="text-xs tracking-[0.2em] uppercase mb-2" style="color: var(--primary-light);">${escapeHtml(dateStr)}</p>
                                <h3 class="font-bebas text-2xl leading-tight mb-2" style="color: var(--ink);">${escapeHtml(ev.name || 'Untitled Event')}</h3>
                                <p class="text-xs mb-4" style="color: var(--ink-muted);">
                                    <i class="fas fa-map-marker-alt mr-1.5"></i>${escapeHtml(ev.venue || 'Memories Night Club, Cape Coast')}
                                </p>
                                <button class="btn-primary w-full py-2.5 rounded-lg text-sm">
                                    <i class="fas fa-ticket-alt mr-2"></i> Get Tickets
                                </button>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

            } catch (error) {
                console.error('Events load error:', error);
                grid.innerHTML = `
                    <div class="empty-state col-span-full">
                        <i class="fas fa-exclamation-triangle block"></i>
                        <p>Could not load events</p>
                        <p class="text-xs mt-2">${escapeHtml(error.message)}</p>
                    </div>`;
            }
        }

        loadEvents();
    </script>
</body>
</html>
