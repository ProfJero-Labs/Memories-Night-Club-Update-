<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Night · Memories</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><script src="config.js"></script><script type="module">import {shell,footer,api} from './app.js';document.querySelector('#app').innerHTML=shell()+`<main><section class="section" style="padding-top:65px"><div class="wrap" style="max-width:850px"><div class="eyebrow">MAKE IT YOURS</div><h1 class="display" style="font-size:110px;line-height:.8">PRIVATE<br>NIGHT</h1><p style="color:var(--muted);max-width:600px;margin:25px 0 40px">Birthdays, launches, corporate nights, old-school reunions or simply your people. Tell us what you're planning.</p><div class="form-grid"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Preferred date</label><input id="date" type="date"></div><div class="field"><label>Guest count</label><input id="guests" type="number" min="1"></div><div class="field"><label>Event type</label><select id="type"><option>Private party</option><option>Birthday</option><option>Corporate</option><option>Launch</option><option>Reunion</option><option>Other</option></select></div><div class="field full"><label>Tell us about it</label><textarea id="message" rows="6"></textarea></div><div class="field full"><button class="btn red" id="submit">SEND REQUEST</button></div></div><div id="result" style="margin-top:20px"></div></div></section></main>`+footer();document.querySelector('#submit').onclick=async()=>{const b=document.querySelector('#submit');b.disabled=true;try{await api('/api/private-requests',{method:'POST',body:JSON.stringify({name:name.value,phone:phone.value,email:email.value,date:date.value,guests:Number(guests.value),eventType:type.value,message:message.value})});document.querySelector('#result').innerHTML='<div class="status success">REQUEST RECEIVED. We will be in touch.</div>'}catch(e){document.querySelector('#result').innerHTML=`<div class="status error">${e.message}</div>`;b.disabled=false}}</script></body></html>
