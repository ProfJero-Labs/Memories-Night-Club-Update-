<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memories · Cape Coast</title>
<meta name="description" content="Memories, SamRit Hotel, Cape Coast. Friday + Saturday. Get tickets, book a table, book an event.">
<meta name="theme-color" content="#0d0a09">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<main id="main">
  <section class="brand wrap" aria-label="Memories">
    <h1 class="sr">Memories</h1>
    <img class="brand-logo" src="assets/logo.png" alt="" width="2083" height="495" fetchpriority="high">
    <div class="strip" id="facts"><span>SamRit Hotel, Cape Coast</span><span>Friday + Saturday</span><span>Doors 10PM</span></div>
  </section>
  <section class="next" aria-labelledby="nextLabel">
    <div class="wrap" id="next"><p class="kicker red" id="nextLabel">Next at Memories</p><div class="loading" role="status">PULLING UP YOUR NIGHT…</div></div>
  </section>
  <section class="more wrap" id="more" hidden aria-labelledby="moreLabel">
    <div class="section-title"><h2 id="moreLabel">Also coming</h2><a class="link" href="nights.html">All nights</a></div>
    <div class="more-row" id="moreRow" style="margin-top:22px"></div>
  </section>
  <nav class="split" aria-label="Plan your night">
    <a href="tables.html"><span class="go" aria-hidden="true">↗</span><span class="kicker">From GHS 2,000</span><span class="display">Tables</span></a>
    <div class="split-tile"><a class="cover" href="private.html" aria-label="Book an event"></a><span class="go" aria-hidden="true">↗</span>
      <span class="kicker hosts"><a href="private.html?type=Corporate">Corporate</a><a href="private.html?type=Event%20organiser">Event organiser</a><a href="private.html?type=Large%20group">Large group</a></span><span class="display">Book an event</span></div>
  </nav>
</main>
<script type="module">
import { chrome, api, esc, img, dateStamp, doors, shortDate, whenLabel, $, loading, errorState } from './app.js';

const s = await chrome('home');
$('#facts').innerHTML = [s.venue || 'SamRit Hotel, Cape Coast', s.nightsLine || 'Friday + Saturday', s.doorsLine || 'Doors 10PM'].map(x => `<span>${esc(x)}</span>`).join('');

const poster = e => `<a class="poster" href="event.html?id=${encodeURIComponent(e.id)}">
  <div class="poster-art">${img(e.artwork, `${e.name} flyer`)}${dateStamp(e.date)}${e.soldOut ? '<span class="flag">Sold out</span>' : ''}</div>
  <h3>${esc(e.name)}</h3><span class="sub">${esc(doors(e))}</span></a>`;

async function load() {
  const next = $('#next');
  next.innerHTML = '<p class="kicker red">Next at Memories</p>' + loading('PULLING UP YOUR NIGHT…');
  let events;
  try { events = (await api('/api/events')).events; }
  catch (e) { return errorState(next, e.message, load); }

  if (!events.length) {
    // Nothing on sale: point at the next open night instead of a dead end.
    const cal = await api('/api/calendar?weeks=6').catch(() => ({ days: [] }));
    const open = cal.days.find(d => d.state === 'open' && d.date > new Date().toISOString().slice(0, 10));
    next.innerHTML = `<p class="kicker red">Next at Memories</p>
      <div class="next-copy" style="margin-top:18px">${open ? dateStamp(open.date + 'T22:00:00Z', 'red') : ''}
      <h2 class="display">${open ? 'The next night drops soon.' : 'New nights drop soon.'}</h2>
      <p class="muted" style="margin:0;max-width:34ch">Want ${open ? esc(shortDate(open.date + 'T00:00:00Z')) : 'a night'} for your event? Book it.</p>
      <div class="row-actions"><a class="btn red" href="private.html${open ? `?date=${open.date}` : ''}">Book an event <span class="arrow">→</span></a></div></div>`;
    return;
  }
  const hero = events.find(e => e.featured && !e.soldOut) || events.find(e => !e.soldOut) || events[0];
  next.innerHTML = `<div class="next-grid">
    <a class="next-art" href="event.html?id=${encodeURIComponent(hero.id)}" aria-label="${esc(hero.name)}">${img(hero.artwork, `${hero.name} flyer`, '', true)}</a>
    <div class="next-copy">
      <p class="kicker red">${esc(whenLabel(hero.date))}</p>
      <h2 class="display">${esc(hero.name)}</h2>
      <div class="meta"><span>${esc(shortDate(hero.date))}</span><span class="muted">${esc(doors(hero))}</span></div>
      <div class="row-actions">
        ${hero.soldOut ? '<span class="btn" aria-disabled="true">Sold out</span>' : `<a class="btn red" href="event.html?id=${encodeURIComponent(hero.id)}#tickets">Get tickets <span class="arrow">→</span></a>`}
        <a class="btn" href="tables.html?event=${encodeURIComponent(hero.id)}">Book a table</a>
      </div>
    </div></div>`;
  const rest = events.filter(e => e.id !== hero.id).slice(0, 3);
  if (rest.length) { $('#more').hidden = false; $('#moreRow').innerHTML = rest.map(poster).join(''); }
}
load();
</script>
</body>
</html>
