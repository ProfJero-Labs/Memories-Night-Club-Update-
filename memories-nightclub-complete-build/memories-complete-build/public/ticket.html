<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket · Memories</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script type="module">
import {api,params,esc} from './app.js';
const token=params.get('token');document.querySelector('#app').innerHTML=`<main class="verify"><div class="wrap" style="max-width:720px;width:100%"><article id="ticket" class="ticket-preview"><div class="eyebrow">MEMORIES</div><div id="body" style="margin-top:20px">Loading ticket…</div></article><div style="display:flex;gap:10px;margin-top:25px;justify-content:center;flex-wrap:wrap"><button class="btn red" id="share">SHARE MY NIGHT</button><button class="btn ghost" onclick="window.print()">SAVE / PRINT</button><a class="btn ghost" href="nights.html">BROWSE NIGHTS</a></div><div id="raffleBox"></div></div></main>`;
try{const d=await api('/api/tickets/'+encodeURIComponent(token));const t=d.ticket;const verifyUrl=`${location.origin}/verify.html?token=${encodeURIComponent(token)}`;document.querySelector('#body').innerHTML=`<div class="eyebrow">${esc(t.eventDate||'')}</div><h1 class="display" style="font-size:clamp(64px,12vw,100px);line-height:.78;margin:18px 0">${esc(t.eventName||'MEMORIES')}</h1><div class="ticket-line">${esc(t.identityLine||'FULLY ACTIVE.')}</div><div class="ticket-rule"></div><p><strong>${esc(t.customerName||'Guest')}</strong></p><p>${esc(t.type||'Ticket')} · ${esc(t.eventVenue||'Cape Coast')} · ${esc(t.eventDoors||'10PM')}</p><div class="qr"><canvas id="qr"></canvas></div><div style="margin-top:20px;display:flex;justify-content:space-between;gap:20px;align-items:end"><div class="ticket-code">${esc(t.displayCode||t.ticketId)}</div><div class="eyebrow">${t.status==='used'?'USED':'VALID'}</div></div>`;if(window.QRCode)QRCode.toCanvas(document.querySelector('#qr'),verifyUrl,{width:180,margin:1});
 document.querySelector('#share').onclick=async()=>{const text=`${t.identityLine||'I’M OUTSIDE.'}\n${t.eventName}\n${t.eventDate||''}\nMemories Night Club`;if(navigator.share){await navigator.share({title:t.eventName,text,url:location.href})}else{await navigator.clipboard.writeText(`${text}\n${location.href}`);alert('Ticket link copied.')}};
 document.querySelector('#raffleBox').innerHTML=`<section class="selector" style="margin-top:35px"><div class="eyebrow">TONIGHT'S RAFFLE</div><h2 class="display" style="font-size:50px">ARE YOU IN?</h2><p style="color:var(--muted)">If this event has an active raffle, enter using your ticket.</p><input id="raffleId" placeholder="Raffle ID" style="width:100%;box-sizing:border-box;padding:13px;background:var(--panel);border:1px solid var(--line);color:var(--paper)"><button id="enterRaffle" class="btn red" style="margin-top:12px">ENTER RAFFLE</button><div id="raffleMsg"></div></section>`;document.querySelector('#enterRaffle').onclick=async()=>{const raffleId=document.querySelector('#raffleId').value.trim();if(!raffleId)return;try{const r=await api('/api/raffle/enter',{method:'POST',body:JSON.stringify({raffleId,ticketToken:token})});document.querySelector('#raffleMsg').innerHTML=`<div class="status success">${r.alreadyEntered?'YOU’RE ALREADY IN.':'YOU’RE IN.'}</div>`}catch(e){document.querySelector('#raffleMsg').innerHTML=`<div class="status error">${esc(e.message)}</div>`}};
}catch(e){document.querySelector('#body').innerHTML='<div class="status error">This ticket could not be found or is no longer available.</div>'}
</script></body></html>
