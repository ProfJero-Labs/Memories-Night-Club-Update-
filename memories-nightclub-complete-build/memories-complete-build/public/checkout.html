<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · Memories</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><div class="toast"></div><script src="config.js"></script><script type="module">
import {shell,footer,getEvent,params,art,esc,money,api} from './app.js';

const eventId = params.get('event');
const ticketTypeId = params.get('ticketType');
const line = params.get('line') || 'FULLY ACTIVE.';

document.querySelector('#app').innerHTML = shell() + `<main><div class="wrap checkout-layout"><section><div class="eyebrow">LOCK IN YOUR NIGHT</div><h1 class="display" style="font-size:92px;line-height:.8;margin:12px 0 35px">YOUR TICKET</h1><div id="form"></div></section><aside class="summary"><div id="preview"></div></aside></div></main>` + footer();

try {
  const data = await getEvent(eventId);
  const t = (data.ticketTypes || []).find(x => x.id === ticketTypeId);
  if (!t) throw new Error('This ticket type is no longer available.');
  const e = data.event;

  let qty = 1;

  const render = () => {
    const maxQty = Math.min(6, t.remaining ?? 6);
    document.querySelector('#form').innerHTML = `
      <div class="ticket-preview" style="margin-bottom:35px">
        <div class="eyebrow" style="color:#665a4d">${esc(new Date(e.date).toLocaleDateString('en-GH',{weekday:'long',day:'numeric',month:'long'}))}</div>
        <h3>${esc(e.name)}</h3>
        <div class="ticket-line">${esc(line)}</div>
        <div class="ticket-rule"></div>
        <div>${esc(t.name)} · ${qty} ticket${qty>1?'s':''}</div>
        <div class="ticket-code" style="margin-top:25px">${esc(e.venue||'CAPE COAST')} · ${esc(e.doors||'10PM')}</div>
      </div>
      <div class="form-grid">
        <div class="field full"><label>Your name</label><input id="buyerName" autocomplete="name" placeholder="Your full name"></div>
        <div class="field"><label>Phone</label><input id="buyerPhone" autocomplete="tel" placeholder="024…"></div>
        <div class="field"><label>Email</label><input id="buyerEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label>Quantity</label><select id="qty">${Array.from({length:maxQty},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></div>
        <div class="field full"><button id="pay" class="btn red" type="button">PAY ${money(t.pricePesewas)} · GET TICKETS</button></div>
        <div id="errBox" class="field full"></div>
      </div>`;

    document.querySelector('#qty').onchange = ev => {
      qty = Number(ev.target.value);
      document.querySelector('#pay').textContent = `PAY ${money(t.pricePesewas * qty)} · GET TICKETS`;
    };

    document.querySelector('#pay').onclick = async () => {
      const buyerName = document.querySelector('#buyerName').value.trim();
      const buyerPhone = document.querySelector('#buyerPhone').value.trim();
      const buyerEmail = document.querySelector('#buyerEmail').value.trim();
      const errBox = document.querySelector('#errBox');
      errBox.innerHTML = '';

      if (!buyerName || !buyerPhone || !buyerEmail) {
        errBox.innerHTML = '<div class="status error">Please complete all details.</div>';
        return;
      }

      const b = document.querySelector('#pay');
      b.disabled = true;
      b.textContent = 'LOCKING IN…';

      try {
        // Correct relative resolution — works from /public/ or root
        const callbackUrl = new URL('payment-return.html', location.href).href;

        const r = await api('/api/checkout/initiate', {
          method: 'POST',
          body: JSON.stringify({
            eventId,
            ticketTypeId,
            quantity: qty,
            buyerName,
            buyerPhone,
            buyerEmail,
            identityLine: line,
            callbackUrl,
          }),
        });

        if (!r.authorizationUrl) throw new Error('Payment could not be started.');
        location.href = r.authorizationUrl;

      } catch (err) {
        console.error('Checkout error:', err);
        errBox.innerHTML = `<div class="status error">${esc(err.message)}</div>`;
        b.disabled = false;
        b.textContent = `PAY ${money(t.pricePesewas * qty)} · GET TICKETS`;
      }
    };
  };

  render();
  document.querySelector('#preview').innerHTML = art(e.artwork, e.name) + `<div style="margin-top:18px"><div class="eyebrow">${esc(t.name)}</div><div class="display" style="font-size:58px">${money(t.pricePesewas)}</div></div>`;

} catch (err) {
  console.error('Checkout load error:', err);
  document.querySelector('main').innerHTML = `<div class="wrap empty" style="margin:80px auto;text-align:center"><div class="eyebrow">UNAVAILABLE</div><h2 class="display" style="font-size:60px;margin:18px 0">CANNOT<br>LOAD TICKET</h2><p style="color:var(--muted);margin-bottom:24px">${esc(err.message)}</p><a href="nights.html" class="btn red">BROWSE NIGHTS</a></div>`;
}
</script></body></html>
