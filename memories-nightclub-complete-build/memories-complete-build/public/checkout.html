<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · Memories</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><div class="toast"></div><script src="config.js"></script><script type="module">
import {shell,footer,getEvent,params,art,esc,money,api} from './app.js';

const eventId = params.get('event');
const ticketTypeId = params.get('ticketType');
const line = params.get('line') || 'FULLY ACTIVE.';

// ── Inline error formatter (was previously imported but never existed) ──
function friendlyError(err) {
  const msg = String(err?.message || err || 'Something went wrong.');
  if (msg.includes('Invalid callback URL')) return 'Configuration error. Please contact support.';
  if (msg.includes('not available') || msg.includes('no longer')) return 'This ticket is no longer available.';
  if (msg.includes('remaining')) return 'Not enough tickets remaining.';
  if (msg.includes('Network') || msg.includes('fetch')) return 'Connection problem. Check your internet and try again.';
  return msg;
}

document.querySelector('#app').innerHTML = shell() + `<main><div class="wrap checkout-layout"><section><div class="eyebrow">LOCK IN YOUR NIGHT</div><h1 class="display" style="font-size:92px;line-height:.8;margin:12px 0 35px">YOUR TICKET</h1><div id="form"></div></section><aside class="summary"><div id="preview"></div></aside></div></main>` + footer();

try {
  const data = await getEvent(eventId);
  const t = (data.ticketTypes || []).find(x => x.id === ticketTypeId);
  if (!t) throw new Error('This ticket type is no longer available.');
  const e = data.event;

  let qty = 1;

  const render = () => {
    const maxQty = Math.min(6, t.remaining ?? 6);
    document.querySelector('#form').innerHTML = `
      <div class="ticket-preview" style="margin-bottom:35px">
        <div class="eyebrow" style="color:#665a4d">${esc(new Date(e.date).toLocaleDateString('en-GH',{weekday:'long',day:'numeric',month:'long'}))}</div>
        <h3>${esc(e.name)}</h3>
        <div class="ticket-line">${esc(line)}</div>
        <div class="ticket-rule"></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
          <span style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#665a4d">Phone</span>
          <span id="previewPhone" style="font-family:var(--mono);font-size:15px;color:#16110f;letter-spacing:.05em">— — —</span>
        </div>
        <div style="margin-top:10px;font-size:13px">${esc(t.name)} · <span id="previewQty">${qty}</span> ticket<span id="previewPlural">${qty>1?'s':''}</span></div>
        <div class="ticket-code" style="margin-top:25px">${esc(e.venue||'CAPE COAST')} · ${esc(e.doors||'10PM')}</div>
      </div>

      <div class="form-grid">
        <div class="field full">
          <label for="buyerPhone">Phone number</label>
          <input id="buyerPhone" autocomplete="tel" inputmode="tel" placeholder="024 123 4567" style="font-size:20px;letter-spacing:.05em;font-family:var(--mono);text-align:center">
          <small style="color:var(--muted);font-size:11px;margin-top:6px;display:block">We'll send your ticket to this number. Show it at the door.</small>
        </div>

        <div class="field full">
          <label for="qty">Quantity</label>
          <select id="qty">${Array.from({length:maxQty},(_,i)=>`<option value="${i+1}">${i+1} ticket${i>0?'s':''}</option>`).join('')}</select>
        </div>

        <div class="field full" style="color:var(--muted);font-size:12px;line-height:1.5">
          Secure payment via Paystack — Mobile Money or card. No account required.
        </div>

        <div class="field full">
          <button id="pay" class="btn red" type="button">PAY ${money(t.pricePesewas)} · GET TICKET</button>
        </div>
        <div id="errBox" class="field full"></div>
      </div>`;

    // ── Quantity change ──
    document.querySelector('#qty').onchange = ev => {
      qty = Number(ev.target.value);
      document.querySelector('#pay').textContent = `PAY ${money(t.pricePesewas * qty)} · GET TICKET${qty>1?'S':''}`;
      document.querySelector('#previewQty').textContent = qty;
      document.querySelector('#previewPlural').textContent = qty > 1 ? 's' : '';
    };

    // ── Live phone preview ──
    const phoneInput = document.querySelector('#buyerPhone');
    const previewPhone = document.querySelector('#previewPhone');
    phoneInput.oninput = ev => {
      const v = ev.target.value.replace(/\D/g, '');
      if (!v) { previewPhone.textContent = '— — —'; return; }
      // Simple grouping: 024 123 4567
      let formatted = v;
      if (v.length > 3 && v.length <= 6) formatted = `${v.slice(0,3)} ${v.slice(3)}`;
      else if (v.length > 6) formatted = `${v.slice(0,3)} ${v.slice(3,6)} ${v.slice(6,10)}`;
      previewPhone.textContent = formatted;
    };

    // ── Pay ──
    document.querySelector('#pay').onclick = async () => {
      const rawPhone = phoneInput.value.replace(/\D/g, '');
      const errBox = document.querySelector('#errBox');
      errBox.innerHTML = '';

      // Ghana phone: 10 digits starting with 0, or 12 digits starting with 233
      let phone = rawPhone;
      if (phone.startsWith('233') && phone.length === 12) phone = '0' + phone.slice(3);
      if (!/^0\d{9}$/.test(phone)) {
        errBox.innerHTML = '<div class="status error">Enter a valid phone number (10 digits, e.g. 0241234567).</div>';
        phoneInput.focus();
        return;
      }

      const b = document.querySelector('#pay');
      b.disabled = true;
      b.textContent = 'LOCKING IN…';

      try {
        const callbackUrl = new URL('payment-return.html', location.href).href;

        // Paystack requires an email. The customer doesn't enter one, so we generate
        // a placeholder tied to their phone. It's a valid format, so Paystack accepts
        // it — no delivery happens to this address, and the SMS is the real receipt.
        const placeholderEmail = `${phone}@guest.memoriesnightclub.com`;

        const r = await api('/api/checkout/initiate', {
          method: 'POST',
          body: JSON.stringify({
            eventId,
            ticketTypeId,
            quantity: qty,
            buyerName: 'Guest',            // not shown on the ticket; phone is the identity
            buyerPhone: phone,
            buyerEmail: placeholderEmail,
            identityLine: line,
            callbackUrl,
          }),
        });

        if (!r.authorizationUrl) throw new Error('Payment could not be started.');
        location.href = r.authorizationUrl;

      } catch (err) {
        console.error('Checkout error:', err);
        errBox.innerHTML = `<div class="status error">${esc(friendlyError(err))}</div>`;
        b.disabled = false;
        b.textContent = `PAY ${money(t.pricePesewas * qty)} · GET TICKET${qty>1?'S':''}`;
      }
    };

    // Auto-focus the phone field
    setTimeout(() => phoneInput.focus(), 100);
  };

  render();
  document.querySelector('#preview').innerHTML = art(e.artwork, e.name) + `<div style="margin-top:18px"><div class="eyebrow">${esc(t.name)}</div><div class="display" style="font-size:58px">${money(t.pricePesewas)}</div></div>`;

} catch (err) {
  console.error('Checkout load error:', err);
  document.querySelector('main').innerHTML = `<div class="wrap empty" style="margin:80px auto;text-align:center"><div class="eyebrow">UNAVAILABLE</div><h2 class="display" style="font-size:60px;margin:18px 0">CANNOT<br>LOAD TICKET</h2><p style="color:var(--muted);margin-bottom:24px">${esc(err.message)}</p><a href="nights.html" class="btn red">BROWSE NIGHTS</a></div>`;
}
</script></body></html>
