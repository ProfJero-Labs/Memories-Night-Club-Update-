<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table · Memories</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><div class="toast"></div><script src="config.js"></script><script type="module">
import {shell,footer,getEvent,params,esc,money,api} from './app.js';
const eventId=params.get('event'),packageId=params.get('package');
document.querySelector('#app').innerHTML=shell()+`<main><div class="wrap checkout-layout"><section><div class="eyebrow">PLAN YOUR NIGHT</div><h1 class="display" style="font-size:clamp(64px,10vw,100px);line-height:.8">TABLE<br>RESERVATION</h1><div id="details" style="margin-top:35px"></div></section><aside class="summary"><div class="summary-box" id="summary">Loading…</div></aside></div></main>`+footer();
try{
 const d=await getEvent(eventId),p=(d.tablePackages||[]).find(x=>x.id===packageId);if(!p)throw Error();
 const bottles=d.bottles||[];let selected={};
 const bottleHTML=bottles.map(b=>`<div class="bottle-row"><div><strong>${esc(b.name)}</strong><small>${money(b.pricePesewas)}</small></div><div class="stepper"><button data-minus="${esc(b.id)}">−</button><span id="qty-${esc(b.id)}">0</span><button data-plus="${esc(b.id)}">+</button></div></div>`).join('');
 document.querySelector('#details').innerHTML=`<div class="table-card"><div class="eyebrow">${esc(d.event.name)}</div><h2 class="display" style="font-size:64px">${esc(p.name)}</h2><p>${esc(p.description||'')}</p><div class="price">${money(p.pricePesewas)}</div></div><section class="selector"><div class="eyebrow">MAKE IT YOURS</div><h2 class="display" style="font-size:48px">CHOOSE BOTTLES</h2><div class="bottle-list">${bottleHTML||'<p style="color:var(--muted)">Bottle options will be published for this night.</p>'}</div></section><div class="form-grid" style="margin-top:20px"><div class="field full"><label>Name</label><input id="name" autocomplete="name"></div><div class="field"><label>Phone</label><input id="phone" autocomplete="tel"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field full"><button class="btn red" id="pay">PAY ${money(p.pricePesewas)} · RESERVE TABLE</button></div></div>`;
 function total(){return Number(p.pricePesewas||0)+Object.entries(selected).reduce((sum,[id,q])=>sum+(bottles.find(x=>x.id===id)?.pricePesewas||0)*q,0)}
 function renderTotal(){const t=total();document.querySelector('#summary').innerHTML=`<div class="eyebrow">YOUR NIGHT</div><h2 class="display" style="font-size:48px">${esc(d.event.name)}</h2><p>${esc(p.name)}</p><div class="summary-total"><span>Total</span><strong>${money(t)}</strong></div>`;document.querySelector('#pay').textContent=`PAY ${money(t)} · RESERVE TABLE`}
 document.querySelectorAll('[data-plus]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.plus;selected[id]=(selected[id]||0)+1;document.querySelector('#qty-'+CSS.escape(id)).textContent=selected[id];renderTotal()});
 document.querySelectorAll('[data-minus]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.minus;selected[id]=Math.max(0,(selected[id]||0)-1);if(!selected[id])delete selected[id];document.querySelector('#qty-'+CSS.escape(id)).textContent=selected[id]||0;renderTotal()});
 renderTotal();
 document.querySelector('#pay').onclick=async()=>{const b=document.querySelector('#pay');const name=document.querySelector('#name').value.trim(),phone=document.querySelector('#phone').value.trim(),email=document.querySelector('#email').value.trim();if(!name||!phone||!email){alert('Please complete your details.');return}b.disabled=true;b.textContent='LOCKING IN…';try{const bottleItems=Object.entries(selected).map(([id,quantity])=>({id,quantity}));const r=await api('/api/table-checkout/initiate',{method:'POST',body:JSON.stringify({eventId,packageId,name,phone,email,bottles:bottleItems,callbackUrl:location.origin+'/payment-return.html'})});location.href=r.authorizationUrl}catch(e){alert(e.message);b.disabled=false;renderTotal()}};
}catch(e){document.querySelector('#details').innerHTML='<div class="empty">This table package is unavailable.</div>'}
</script></body></html>
