# Deploys over the existing Paystack worker, so the site's apiBase (public/config.js) and the
# Paystack dashboard keep pointing at the same host.
name = "memories-paystack-verify"
main = "src/index.js"
compatibility_date = "2026-09-23"
workers_dev = true
# Keep the variables set in the Cloudflare dashboard when deploying. Without this, every deploy
# (Workers Builds on each commit) replaces them with only the [vars] below, and anything that was
# saved as a plain variable instead of a secret (e.g. a key) disappears.
keep_vars = true
# AsyncLocalStorage only (what Sentry needs). Deliberately not the broader nodejs_compat.
compatibility_flags = ["nodejs_als"]

[vars]
FIREBASE_PROJECT_ID = "memoriesnightclub-2717f"
ALLOWED_ORIGINS = "https://memoriesnightclub.com,https://www.memoriesnightclub.com,https://memoriesnightclub.pages.dev"
# Production origins only. Local previews use `npm run dev`, which serves the site and its own Worker.
PUBLIC_SITE_URL = "https://memoriesnightclub.com"
SMS_SENDER = "MEMORIES"
# SMS over the public URL, authenticated with SMS_WORKER_KEY (set as a secret on both workers).
SMS_WORKER_URL = "https://memories-sms.diamondj04102026.workers.dev"

# Fallback EvolveIT share % used when an event has no evolveitSharePct of its own.
EVOLVEIT_SHARE_PCT = "10"

# Worker-to-worker SMS over Cloudflare's internal network. The paystack worker calls
# memories-sms directly, no public URL involved.
# (Kept after [vars]: in TOML everything below a table header belongs to that table.)
[[services]]
binding = "SMS"
service = "memories-sms"

# Edge rate limits (Workers Rate Limiting API). Keys are "<route>:<client IP>".
[[ratelimits]]
name = "RL_STRICT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_STANDARD"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Daily 03:00 sweep forfeits unfinished pay-in-bits orders once their night has passed.
# Every 10 minutes: payment reconciliation (src/reconcile.js). Keep the cron string in sync with src/index.js.
[triggers]
crons = ["0 3 * * *", "*/10 * * * *"]

# Gives Sentry the deployed version id, so each error says which release caused it.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Keep the Worker's logs (Workers → memories-paystack-verify → Logs), so an error on a live request
# can be read: every unexpected error is logged as "request failed" with its reason.
[observability]
enabled = true
